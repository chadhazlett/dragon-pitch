<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1030" />
  <title>Happy Birthday, CharChar! 🐉🎉</title>
  <link rel="icon" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* this page scrolls/centers instead of the game's fixed layout */
    html, body { overflow-y: auto; height: auto; min-height: 100%; }
    #bgTint { background: radial-gradient(circle at 50% 32%, rgba(124,77,255,.4), rgba(0,0,0,0) 62%); }
    #confetti { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .bday-wrap { position: relative; z-index: 2; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 26px 18px; }
    .bday-card {
      background: rgba(47,33,80,.82); border-radius: 26px; padding: 30px 26px 34px;
      width: 100%; max-width: 480px; text-align: center;
      box-shadow: 0 16px 50px rgba(0,0,0,.55); border: 1px solid rgba(124,77,255,.4);
      backdrop-filter: blur(2px);
    }
    .bday-dragon { display: block; width: min(64vw, 230px); height: auto; margin: 0 auto 6px;
      image-rendering: pixelated; filter: drop-shadow(0 8px 18px rgba(255,207,51,.55));
      animation: float 3.2s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }

    .bday-card h1 { font-size: 2.5rem; line-height: 1.1; margin: 6px 0 4px; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
    .bday-card h1 .num { color: var(--accent); }
    .bday-card h1 .name { color: var(--accent); display: inline-block; animation: pop 0.6s ease-out both; }
    @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

    .bday-msg { color: var(--text); font-size: 1.12rem; line-height: 1.5; margin: 14px 6px 24px; opacity: .95; }

    .play-btn {
      display: inline-block; text-decoration: none;
      background: linear-gradient(180deg, var(--accent), #f0b400); color: #3a2600;
      border-radius: 18px; font-size: 1.35rem; font-weight: 800; padding: 17px 28px;
      box-shadow: 0 7px 0 #b88600; transition: transform .05s, box-shadow .05s;
    }
    .play-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #b88600; }
    .signoff { margin-top: 18px; font-size: 1.6rem; letter-spacing: 6px; }
    @media (min-width: 480px) { .bday-card h1 { font-size: 3rem; } }
  </style>
</head>
<body>
  <div id="bgTint"></div>
  <canvas id="confetti"></canvas>

  <div class="bday-wrap">
    <div class="bday-card">
      <img class="bday-dragon" src="assets/dragons/gold.svg" alt="golden dragon" />
      <h1 id="greeting">Happy Birthday! 🎉</h1>
      <p class="bday-msg">We thought you might like this Minecraft-themed dragon-slaying ear-training game!</p>
      <a class="play-btn" id="playBtn" href="index.html">▶ Play Dragon Pitch 🐉🎹</a>
      <div class="signoff">🎂🎈🎁</div>
    </div>
  </div>

  <a id="photoCredit" href="https://www.g-portal.com/en/blog/minecraft-dimensions-en" target="_blank" rel="noopener">📷 “The End” · g-portal.com</a>

  <script>
    // Personalize from the URL: happy-birthday.html?name=CharChar&age=8
    (function () {
      const params = new URLSearchParams(location.search);
      const rawName = params.get("name");
      const name = rawName ? rawName.trim().slice(0, 40) : "";
      const ageRaw = params.get("age");
      const age = ageRaw && /^\d{1,3}$/.test(ageRaw) ? parseInt(ageRaw, 10) : null;
      const ordinal = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
      const h = document.getElementById("greeting");
      const playBtn = document.getElementById("playBtn");
      if (name) {
        document.title = "Happy Birthday, " + name + "! 🐉🎉";
        h.textContent = "";
        h.appendChild(document.createTextNode("Happy "));
        if (age) { const num = document.createElement("span"); num.className = "num"; num.textContent = ordinal(age) + " "; h.appendChild(num); }
        h.appendChild(document.createTextNode("Birthday,"));
        h.appendChild(document.createElement("br"));
        const sp = document.createElement("span"); sp.className = "name"; sp.textContent = name + "!"; h.appendChild(sp);
        h.appendChild(document.createTextNode(" 🎉"));
        playBtn.href = "index.html?name=" + encodeURIComponent(name);
      } else {
        document.title = "Happy Birthday! 🐉🎉";
        h.textContent = "Happy Birthday! 🎉";
        playBtn.href = "index.html";
      }
    })();
    // register the service worker so this card is installable as the Dragon Pitch app
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  </script>

  <script>
    // lightweight confetti
    const cv = document.getElementById("confetti");
    const ctx = cv.getContext("2d");
    let W, H;
    function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
    resize(); window.addEventListener("resize", resize);
    const COLORS = ["#ffd23f", "#7c4dff", "#36d399", "#ff6b6b", "#4fc3ff", "#ff9ce0"];
    const N = 140, P = [];
    function mk(spread) {
      return {
        x: Math.random() * W, y: spread ? Math.random() * H : -20,
        r: 4 + Math.random() * 7, c: COLORS[(Math.random() * COLORS.length) | 0],
        vy: 1 + Math.random() * 2.4, vx: (Math.random() - 0.5) * 1.1,
        a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.22, sway: Math.random() * 1.6,
      };
    }
    for (let i = 0; i < N; i++) P.push(mk(true));
    function tick() {
      ctx.clearRect(0, 0, W, H);
      for (const p of P) {
        p.y += p.vy; p.x += p.vx + Math.sin(p.y * 0.02) * p.sway * 0.3; p.a += p.va;
        if (p.y > H + 20) { Object.assign(p, mk(false)); }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
