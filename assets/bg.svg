<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221347"/>
      <stop offset="0.55" stop-color="#150c2e"/>
      <stop offset="1" stop-color="#0c0720"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- pixel stars -->
  <g fill="#d9ccff">
    <rect x="80"  y="70"  width="7" height="7" opacity="0.8"/>
    <rect x="180" y="140" width="6" height="6" opacity="0.6"/>
    <rect x="260" y="60"  width="8" height="8" opacity="0.9"/>
    <rect x="360" y="120" width="5" height="5" opacity="0.7"/>
    <rect x="470" y="80"  width="7" height="7" opacity="0.85"/>
    <rect x="560" y="150" width="6" height="6" opacity="0.6"/>
    <rect x="690" y="70"  width="8" height="8" opacity="0.9"/>
    <rect x="780" y="130" width="5" height="5" opacity="0.7"/>
    <rect x="880" y="60"  width="7" height="7" opacity="0.8"/>
    <rect x="980" y="120" width="6" height="6" opacity="0.6"/>
    <rect x="1080" y="80" width="8" height="8" opacity="0.9"/>
    <rect x="140" y="230" width="6" height="6" opacity="0.6"/>
    <rect x="330" y="210" width="5" height="5" opacity="0.7"/>
    <rect x="640" y="200" width="6" height="6" opacity="0.65"/>
    <rect x="900" y="220" width="7" height="7" opacity="0.8"/>
    <rect x="1120" y="190" width="6" height="6" opacity="0.7"/>
    <rect x="40"  y="320" width="6" height="6" opacity="0.6"/>
    <rect x="1150" y="300" width="7" height="7" opacity="0.8"/>
    <rect x="220" y="380" width="5" height="5" opacity="0.55"/>
    <rect x="1010" y="360" width="6" height="6" opacity="0.6"/>
  </g>

  <!-- faint blocky dragon -->
  <g fill="#c9b6ff" opacity="0.10">
    <rect x="540" y="300" width="170" height="70"/>   <!-- body -->
    <rect x="690" y="290" width="60"  height="55"/>   <!-- neck -->
    <rect x="740" y="270" width="75"  height="75"/>   <!-- head -->
    <rect x="815" y="300" width="45"  height="32"/>   <!-- snout -->
    <rect x="760" y="250" width="18"  height="24"/>   <!-- horn -->
    <rect x="470" y="312" width="70"  height="46"/>   <!-- tail 1 -->
    <rect x="410" y="322" width="60"  height="34"/>   <!-- tail 2 -->
    <rect x="360" y="330" width="50"  height="24"/>   <!-- tail 3 -->
    <rect x="320" y="336" width="30"  height="16"/>   <!-- tail tip -->
    <rect x="560" y="220" width="90"  height="85"/>   <!-- upper wing -->
    <rect x="590" y="170" width="55"  height="55"/>   <!-- upper wing tip -->
    <rect x="560" y="365" width="90"  height="85"/>   <!-- lower wing -->
    <rect x="590" y="450" width="55"  height="55"/>   <!-- lower wing tip -->
    <rect x="560" y="365" width="28"  height="50"/>   <!-- front leg -->
    <rect x="650" y="365" width="28"  height="50"/>   <!-- back leg -->
  </g>
  <rect x="770" y="296" width="16" height="16" fill="#7c4dff" opacity="0.18"/> <!-- dragon eye -->

  <!-- obsidian pillars (End vibe) -->
  <g>
    <rect x="120"  y="640" width="70" height="160" fill="#17112e"/>
    <rect x="110"  y="626" width="90" height="16"  fill="#241a48"/>
    <rect x="145"  y="600" width="20" height="26"  fill="#b07cff" opacity="0.85"/>

    <rect x="300"  y="680" width="60" height="120" fill="#140f26"/>
    <rect x="292"  y="668" width="76" height="14"  fill="#211944"/>

    <rect x="520"  y="620" width="80" height="180" fill="#191230"/>
    <rect x="510"  y="606" width="100" height="16" fill="#271c50"/>
    <rect x="550"  y="578" width="22" height="28"  fill="#b07cff" opacity="0.85"/>

    <rect x="760"  y="690" width="60" height="110" fill="#140f26"/>
    <rect x="752"  y="678" width="76" height="14"  fill="#211944"/>

    <rect x="950"  y="650" width="75" height="150" fill="#17112e"/>
    <rect x="940"  y="636" width="95" height="16"  fill="#241a48"/>
    <rect x="978"  y="610" width="20" height="26"  fill="#b07cff" opacity="0.85"/>

    <rect x="1080" y="700" width="55" height="100" fill="#140f26"/>
    <rect x="1072" y="688" width="71" height="14"  fill="#211944"/>
  </g>
</svg>
